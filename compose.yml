# Reference setup for a single host (Leitfaden Kap. 4). Same image as in Kubernetes.
# Start: cp .env.example .env && docker compose up --build
services:
  topic-tree:
    build: .
    image: topic-tree:local
    env_file: .env
    ports:
      - "8000:8000"   # public API
      - "9000:9000"   # internal: /health, /ready, /metrics (do not expose beyond the host)
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 90s
    restart: unless-stopped
