# Lint, test, chart checks, and image build. Tags vX.Y.Z must equal the version in pyproject.toml.
stages:
  - test
  - build

variables:
  UV_VERSION: "0.9"
  PYTHON_VERSION: "3.13"
  BASE_LAYER: bookworm-slim
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  IMAGE: $DOCKER_REGISTRY/projects/wlo/topic-tree

.uv:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  cache:
    - key:
        files: [uv.lock]
      paths: [$UV_CACHE_DIR]
  before_script:
    - uv sync --frozen

lint:
  extends: .uv
  stage: test
  script:
    - uv run ruff check --output-format=gitlab > code-quality-report.json || (cat code-quality-report.json; exit 1)
    - uv run ruff format --check
  artifacts:
    when: always
    reports:
      codequality: code-quality-report.json

tests:
  extends: .uv
  stage: test
  script:
    # The chart tests skip themselves without helm; the chart job below covers them.
    - uv run pytest -q

chart:
  stage: test
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  script:
    - helm lint --strict deploy/helm/topic-tree
    - helm template t deploy/helm/topic-tree --set networkPolicy.enabled=true --set autoscaling.enabled=true > rendered.yaml
  artifacts:
    paths: [rendered.yaml]

kubeconform:
  stage: test
  needs: [chart]
  image:
    name: ghcr.io/yannh/kubeconform:v0.6.7-alpine
    entrypoint: [""]
  script:
    - /kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

.docker:
  stage: build
  image: $DIND_IMAGE
  variables:
    DOCKER_HOST: "$DIND_HOST"
    DOCKER_DRIVER: "$DIND_DRIVER"
    DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

image branch:
  extends: .docker
  script:
    - docker buildx build --tag "$IMAGE:$CI_COMMIT_REF_SLUG" --push .
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

image release:
  extends: .docker
  script:
    - VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
    - test "$CI_COMMIT_TAG" = "v$VERSION" || (echo "tag $CI_COMMIT_TAG != v$VERSION" && exit 1)
    - docker buildx build --tag "$IMAGE:$VERSION" --tag "$IMAGE:${VERSION%.*}" --push .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

chart release:
  stage: build
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  script:
    - VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
    - test "$CI_COMMIT_TAG" = "v$VERSION" || (echo "tag $CI_COMMIT_TAG != v$VERSION" && exit 1)
    - helm package deploy/helm/topic-tree --destination dist/
    - |
      if [ -n "${CHART_REGISTRY:-}" ]; then
        echo "$DOCKER_PASSWORD" | helm registry login "$CHART_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
        helm push "dist/topic-tree-$VERSION.tgz" "oci://$CHART_REGISTRY/projects/wlo/charts"
      fi
  artifacts:
    paths: [dist/*.tgz]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
