# Reverse-proxy / Compose-from-URL stack (pre-built image, Traefik HTTPS labels, zero required env vars).
# First start works without any variables and without a domain (direct port 18000); set DOMAIN and credentials in
# .env afterwards and redeploy.
# For local builds with direct host ports, use: docker compose -f docker-compose.build.yml up --build
# PUBLIC_PORT / INTERNAL_PORT in .env change the container ports; Traefik routing and the healthcheck follow them.
# A second instance on the same host (e.g. staging) needs its own TRAEFIK_ROUTER name: Traefik router and service
# names are global, and equal names would merge both containers into one load-balanced service.
services:
  topic-tree:
    image: ${IMAGE:-ghcr.io/janschachtschabel/topic-tree-generator-11-2026:latest}
    env_file:
      - path: .env
        required: false
    environment:
      - DOMAIN=${DOMAIN:-}
    # Direct access without a domain: http://<server-ip>:18000/ui/ (HOST_PORT). Default 18000 is unlikely to be
    # taken, so the first deploy works next to other services. Once DOMAIN is served by Traefik, HOST_BIND=127.0.0.1
    # closes this unencrypted path. The internal port (metrics, /ready) is never published.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-18000}:${PUBLIC_PORT:-8000}"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 90s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:${INTERNAL_PORT:-9000}/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-topic-tree-web}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-topic-tree}.rule=Host(`${DOMAIN:-}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-topic-tree}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-topic-tree}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-topic-tree}.service=${TRAEFIK_ROUTER:-topic-tree}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-topic-tree}.loadbalancer.server.port=${PUBLIC_PORT:-8000}"

networks:
  default:
    name: ${TRAEFIK_NETWORK:-topic-tree-web}
