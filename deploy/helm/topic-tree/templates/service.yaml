apiVersion: v1
kind: Service
metadata:
  name: {{ include "topic-tree.fullname" . }}
  labels: {{- include "topic-tree.labels" . | nindent 4 }}
spec:
  selector: {{- include "topic-tree.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: internal
      port: {{ .Values.ports.internal }}
      targetPort: internal
