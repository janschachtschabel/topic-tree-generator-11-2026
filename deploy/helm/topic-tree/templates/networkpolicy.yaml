{{- if .Values.networkPolicy.enabled }}
{{- /* An ingress rule with an empty "from" list matches ALL sources, so rules are only rendered for listed peers. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "topic-tree.fullname" . }}
  labels: {{- include "topic-tree.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "topic-tree.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    {{- with .Values.networkPolicy.publicFrom }}
    - ports: [{ port: http }]
      from: {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.internalFrom }}
    - ports: [{ port: internal }]
      from: {{- toYaml . | nindent 8 }}
    {{- end }}
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
