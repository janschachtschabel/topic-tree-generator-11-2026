[project]
name = "topic-tree-generator"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "loguru>=0.7.3",
    "openai>=1.99.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.13.1",
    "rdflib>=7.1.4",
    "certifi>=2026.10.19",
    "gunicorn>=27.0.1",
    "uvicorn-worker>=0.4.0",
    "prometheus-client>=0.26.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.5.0",
    "rdflib>=7.1.4",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Frozen legacy endpoints: behaviour must not change, so known findings are accepted here, not fixed.
"app/legacy/**" = ["BLE001", "B005", "TRY002", "RUF010"]
"tests/**" = ["RUF012", "S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["slow: starts real server processes"]
