[project]
name = "topic-tree-generator"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "loguru>=0.7.3",
    "openai>=1.99.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.13.1",
    "rdflib>=7.1.4",
    "ruff>=0.12.8",
    "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
