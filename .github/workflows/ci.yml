# Lint, tests, compose checks, chart & alert rule validation, and GHCR image + OCI chart publishing on main/tags.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - name: Release tag consistency check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER="$(uv run python -c 'from app.version import service_version; print(service_version())')"
          if [ "$TAG_VER" != "$PY_VER" ]; then
            echo "Tag $TAG_VER does not match service version $PY_VER" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Docker Compose validation
        run: |
          docker compose config -q
          docker compose -f docker-compose.build.yml config -q
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.build.yml config -q
          rm -f .env
      - name: Chart lint, schema, and promtool alert validation
        run: |
          helm lint --strict deploy/helm/topic-tree
          helm template t deploy/helm/topic-tree \
            --set networkPolicy.enabled=true --set autoscaling.enabled=true --set ingress.enabled=true \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -
          helm template t deploy/helm/topic-tree --set prometheusRule.enabled=true -s templates/prometheusrule.yaml \
            | uv run python -c 'import sys, yaml; d = yaml.safe_load(sys.stdin); print(yaml.safe_dump(d["spec"]))' \
            > /tmp/alerts.yaml
          docker run --rm --entrypoint promtool -v /tmp/alerts.yaml:/alerts.yaml:ro prom/prometheus:v2.55.1 check rules /alerts.yaml

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: v3.16.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package and push Helm chart to GHCR OCI on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/topic-tree
          helm push topic-tree-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts"
