# Lint, tests, compose checks, chart & alert rule validation, and GHCR image + OCI chart publishing on main/tags.
name: ci

on:
  push:
  pull_request:
  # Re-run on a release tag by hand (Actions > ci > Run workflow > pick the tag), e.g. when a tag made with an
  # integration token did not trigger a push run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - name: Release tag consistency check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER="$(uv run python -c 'from app.version import service_version; print(service_version())')"
          if [ "$TAG_VER" != "$PY_VER" ]; then
            echo "Tag $TAG_VER does not match service version $PY_VER" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Docker Compose validation
        run: |
          docker compose config -q
          docker compose -f docker-compose.build.yml config -q
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.build.yml config -q
          rm -f .env
      - name: Chart lint, schema, and promtool alert validation
        run: |
          helm lint --strict deploy/helm/topic-tree
          helm template t deploy/helm/topic-tree \
            --set networkPolicy.enabled=true --set autoscaling.enabled=true --set ingress.enabled=true \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -
          mkdir -p /tmp/alerts
          helm template t deploy/helm/topic-tree --set prometheusRule.enabled=true -s templates/prometheusrule.yaml \
            | uv run python -c 'import sys, yaml; d = yaml.safe_load(sys.stdin); print(yaml.safe_dump(d["spec"]))' \
            > /tmp/alerts/alerts.yaml
          cp tests/alerts/topic-tree.test.yml /tmp/alerts/
          docker run --rm --entrypoint promtool -v /tmp/alerts:/alerts:ro -w /alerts prom/prometheus:v2.55.1 \
            check rules alerts.yaml
          docker run --rm --entrypoint promtool -v /tmp/alerts:/alerts:ro -w /alerts prom/prometheus:v2.55.1 \
            test rules topic-tree.test.yml

  # Known vulnerabilities in the locked runtime dependencies. Reports only: it does not block publishing.
  # pip-audit runs via uvx and is not a project dependency (no new entry in pyproject.toml).
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.txt
      - run: uvx pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off

  publish:
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: v3.16.3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version is never overwritten. After a partial publish (image pushed, chart failed), a re-run pushes only
      # the missing part. The chart lookup is logged in, so a private package is not mistaken for a missing one.
      - name: Publish each release version only once
        id: once
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=false; chart=false
          docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY,,}:${VER}" > /dev/null 2>&1 && image=true
          helm show chart "oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts/topic-tree" --version "${VER}" > /dev/null 2>&1 && chart=true
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "chart=${chart}" >> "$GITHUB_OUTPUT"
          if [ "$image" = true ] && [ "$chart" = true ]; then
            echo "Image and chart ${VER} are already published; a version is never overwritten." >&2
            exit 1
          fi
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only from main: a release tag must not move it (default flavor would).
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        if: steps.once.outputs.image != 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package and push Helm chart to GHCR OCI on release tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.once.outputs.chart != 'true'
        run: |
          helm package deploy/helm/topic-tree
          helm push topic-tree-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts"
